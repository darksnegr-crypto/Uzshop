<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-dark navbar-custom">
    <div class="container">
      <span class="navbar-brand">⚙️ Admin panel</span>
      <a class="btn btn-outline-light btn-sm rounded-pill" href="index.html">Saytni ko'rish</a>
    </div>
  </nav>

  <div class="container pb-5">

    <div class="page-head">
      <h3>Boshqaruv paneli</h3>
      <span class="text-muted">Mahsulotlar va buyurtmalarni shu yerdan boshqaring</span>
    </div>

    <!-- Statistika -->
    <div class="row g-3 mb-4" id="stats"></div>

    <!-- Grafiklar -->
    <div class="row g-3 mb-4">
      <div class="col-lg-4">
        <div class="card h-100"><div class="card-body">
          <h6 class="fw-bold">📊 Kategoriyalar bo'yicha mahsulotlar</h6>
          <div style="height:250px"><canvas id="chartCategory"></canvas></div>
        </div></div>
      </div>
      <div class="col-lg-4">
        <div class="card h-100"><div class="card-body">
          <h6 class="fw-bold">🍩 Buyurtmalar holati</h6>
          <div style="height:250px"><canvas id="chartStatus"></canvas></div>
        </div></div>
      </div>
      <div class="col-lg-4">
        <div class="card h-100"><div class="card-body">
          <h6 class="fw-bold">💰 Oxirgi 7 kunlik savdo (so'm)</h6>
          <div style="height:250px"><canvas id="chartSales"></canvas></div>
        </div></div>
      </div>
    </div>

    <!-- Bo'limlar -->
    <ul class="nav nav-pills mb-4">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tabProducts">📦 Mahsulotlar</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tabOrders">🚚 Buyurtmalar</button></li>
    </ul>

    <div class="tab-content">

      <!-- 1-bo'lim: Mahsulotlar -->
      <div class="tab-pane fade show active" id="tabProducts">
        <div class="card mb-4">
          <div class="card-body p-4">
            <h5 class="fw-bold mb-3" id="formTitle">Yangi mahsulot qo'shish</h5>
            <div class="row g-3">
              <div class="col-md-6"><input class="form-control" id="pName" placeholder="Nomi"></div>
              <div class="col-md-6"><input class="form-control" id="pPrice" type="number" placeholder="Narxi (so'm)"></div>
              <div class="col-md-6"><input class="form-control" id="pCategory" list="catList" placeholder="Kategoriya"><datalist id="catList"></datalist></div>
              <div class="col-md-6"><input class="form-control" id="pImg" placeholder="Rasm linki (https://...)"></div>
              <div class="col-12"><textarea class="form-control" id="pDesc" placeholder="Tavsif"></textarea></div>
            </div>
            <button class="btn btn-primary mt-3 px-4" onclick="saveProduct()">Saqlash</button>
            <button class="btn btn-light mt-3" onclick="clearForm()">Tozalash</button>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-hover bg-white align-middle mb-0">
            <thead><tr><th>Rasm</th><th>Nomi</th><th>Kategoriya</th><th>Narxi</th><th>Amal</th></tr></thead>
            <tbody id="productTable"></tbody>
          </table>
        </div>
      </div>

      <!-- 2-bo'lim: Buyurtmalar -->
      <div class="tab-pane fade" id="tabOrders"></div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
